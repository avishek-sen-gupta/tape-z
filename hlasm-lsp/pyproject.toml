[tool.poetry]
name = "hlasm-lsp"
version = "0.1.0"
description = "HLASM Language Server Protocol server"
authors = ["avishek-sen-gupta <asgupta@thoughtworks.com>"]
packages = [{include = "hlasm_lsp"}]

[tool.poetry.dependencies]
python = "^3.13"
pygls = "^2.0"
tree-sitter = "^0.25"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"
black = "^24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
